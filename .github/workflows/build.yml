name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Shared Nuitka flags applied on every platform
  NUITKA_COMMON: >-
    --standalone
    --assume-yes-for-downloads
    --enable-plugin=pyside6
    --lto=yes
    --python-flag=no_docstrings
    --python-flag=no_asserts
    --python-flag=-m
    --python-flag=isolated
    --jobs=4
    --noinclude-qt-translations
    --include-qt-plugins=sensible
    --include-package-data=epic_report_generator.resources
    --include-package-data=qt_material
    --include-package=typst
    --noinclude-setuptools-mode=nofollow
    --noinclude-pytest-mode=nofollow
  # Modules to exclude — space-separated, expanded into --nofollow-import-to= flags at build time
  # NOTE: QtSvg is intentionally KEPT — qt-material renders all its UI chrome
  # (combobox arrows, checkboxes, radios, tree branches) from SVG icons via the
  # qsvg plugin. QtNetwork (OAuth avatar) and QtPdf (PDF preview) are also required.
  NUITKA_NOFOLLOW: >-
    tkinter unittest test distutils
    ftplib imaplib poplib smtplib telnetlib nntplib
    sunau wave aifc pydoc doctest lib2to3
    PySide6.QtWebEngineWidgets PySide6.QtWebEngineCore PySide6.QtWebEngineQuick
    PySide6.QtMultimedia PySide6.QtMultimediaWidgets
    PySide6.Qt3DCore PySide6.Qt3DRender PySide6.Qt3DInput PySide6.Qt3DLogic
    PySide6.Qt3DAnimation PySide6.Qt3DExtras
    PySide6.QtQuick PySide6.QtQuickWidgets PySide6.QtQml
    PySide6.QtDataVisualization PySide6.QtCharts PySide6.QtDesigner
    PySide6.QtHelp PySide6.QtBluetooth PySide6.QtNfc
    PySide6.QtPositioning PySide6.QtSensors PySide6.QtSerialPort
    PySide6.QtRemoteObjects PySide6.QtSpatialAudio PySide6.QtTextToSpeech
    PySide6.QtSvgWidgets PySide6.QtPrintSupport PySide6.QtSql
    PySide6.QtConcurrent PySide6.QtXml PySide6.QtDBus PySide6.QtPdfWidgets
    PySide6.QtOpenGL PySide6.QtOpenGLWidgets

jobs:
  # Guard: on tag builds, the tag must match the version in pyproject.toml.
  # Runs once (not per-OS) and gates the whole matrix via `needs`. The check is
  # step-scoped to tags so workflow_dispatch on a branch still succeeds (a job
  # whose only check is skipped counts as success, so `build` proceeds).
  validate-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify tag matches pyproject.toml version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION=$(python -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          print(data['project']['version'])
          ")
          TAG="${{ github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match pyproject.toml version '$VERSION'. Bump the version in pyproject.toml to match the tag (or retag)."
            exit 1
          fi
          echo "Tag '$TAG' matches pyproject.toml version '$VERSION'."

  build:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            installer_path: "epic-report-generator.AppImage"
          - os: macos-26
            installer_path: "epic-report-generator.dmg"
          - os: windows-2025
            installer_path: "packaging/windows/Output/epic-report-generator-setup.exe"
    runs-on: ${{ matrix.os }}

    # macOS signing + notarization credentials, surfaced as env so steps can guard
    # on their presence (the `secrets` context can't be read in a step `if:`).
    # Absent on forks / PRs from forks → the macOS build degrades gracefully to an
    # unsigned, un-notarized DMG instead of failing.
    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 patchelf libxkbcommon0 libxcb-cursor0 libfuse2t64

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build "nuitka[onefile]" imageio

      - name: Run tests
        run: pytest --tb=short

      - name: Build wheel
        run: python -m build --wheel

      - name: Read version from pyproject.toml
        id: meta
        shell: bash
        run: |
          VERSION=$(python -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          print(data['project']['version'])
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Convert PNG to ICO (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -c "
          from PIL import Image
          img = Image.open('src/epic_report_generator/resources/logo.png')
          img.save('src/epic_report_generator/resources/logo.ico', sizes=[(16,16),(32,32),(48,48),(256,256)])
          "

      - name: Build Nuitka binary
        shell: bash
        run: |
          # Expand nofollow list into individual flags
          NOFOLLOW_FLAGS=()
          for mod in $NUITKA_NOFOLLOW; do
            NOFOLLOW_FLAGS+=("--nofollow-import-to=$mod")
          done

          # Platform-specific flags
          case "$RUNNER_OS" in
            Windows)
              PLATFORM_FLAGS=(
                --onefile
                # Bundle the MSVC runtime (vcruntime140/msvcp140) so the app runs
                # on machines without the VC++ redistributable. Explicit to silence
                # Nuitka's "make this explicit" warning; this is the prior default.
                --include-windows-runtime-dlls=yes
                --windows-console-mode=disable
                "--windows-icon-from-ico=src/epic_report_generator/resources/logo.ico"
                "--windows-company-name=Epic Report Generator"
                "--windows-product-name=Epic Report Generator"
                "--windows-file-version=${{ steps.meta.outputs.version }}.0"
                "--windows-product-version=${{ steps.meta.outputs.version }}.0"
                "--output-filename=epic-report-generator.exe"
              )
              ;;
            macOS)
              PLATFORM_FLAGS=(
                --macos-create-app-bundle
                "--macos-app-name=Epic Report Generator"
                "--macos-app-icon=src/epic_report_generator/resources/logo.png"
                "--macos-app-version=${{ steps.meta.outputs.version }}"
                "--output-filename=epic-report-generator"
                "--output-dir=."
              )
              ;;
            Linux)
              PLATFORM_FLAGS=(
                # actions/setup-python ships a static libpython; link it in for
                # faster startup and one fewer .so in the dist. The --selftest
                # gate below runs the built binary, so any static-link breakage
                # fails CI before release.
                --static-libpython=yes
                "--output-filename=epic-report-generator"
                "--output-dir=."
              )
              ;;
          esac

          # shellcheck disable=SC2086
          python -m nuitka $NUITKA_COMMON \
            "${NOFOLLOW_FLAGS[@]}" \
            "${PLATFORM_FLAGS[@]}" \
            src/epic_report_generator

          # Nuitka names output dirs after the package name;
          # rename to the expected names.
          case "$RUNNER_OS" in
            Linux)  mv epic_report_generator.dist epic-report-generator.dist ;;
            macOS)  mv epic_report_generator.app  "Epic Report Generator.app"  ;;
          esac

      # ── Import the Developer ID signing certificate (macOS) ───────
      # Loads the .p12 (Developer ID Application cert + private key) into a
      # throwaway keychain and resolves the identity name for later steps.
      # Skipped when the secret is absent → the build stays unsigned.
      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERT_P12_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          P12="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Allow codesign to use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Prepend our keychain to the search list so codesign can find the identity.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed s/\"//g)
          # `|| true`: awk's early `exit` can SIGPIPE find-identity, which pipefail
          # would otherwise turn into a step abort before the guard below runs.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')" || true
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in the imported certificate."
            echo "::error::Apps distributed outside the App Store must be signed with a"
            echo "::error::Developer ID Application cert — a Mac App Store / Apple Distribution"
            echo "::error::cert will not pass Gatekeeper. Create one at developer.apple.com."
            security find-identity -v -p codesigning "$KEYCHAIN" || true
            exit 1
          fi
          echo "Signing identity: $IDENTITY"
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$P12"

      # ── Shrink: strip debug symbols ────────────────────────────────
      # Nuitka strips its own generated binary but copies third-party libs
      # (notably the ~76 MB unstripped Typst compiler) as-is. Strip them.
      - name: Strip binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="Epic Report Generator.app"
          find "$APP/Contents" -type f | while read -r f; do
            file "$f" | grep -q 'Mach-O' && strip -x "$f" 2>/dev/null || true
          done
          # Stripping invalidates Nuitka's ad-hoc signature; re-sign or the app
          # will not launch on Apple Silicon. With a Developer ID identity present
          # (from the import step) sign for real with the hardened runtime +
          # entitlements that notarization requires; otherwise fall back to an
          # ad-hoc signature so unsigned builds (forks/PRs) still launch.
          #
          # entitlements.plist requests three hardened-runtime exceptions a
          # Python/Qt bundle needs to launch under the hardened runtime:
          #   * allow-jit / allow-unsigned-executable-memory — CPython (embedded
          #     by Nuitka) and some C extensions allocate executable memory.
          #   * disable-library-validation — the bundle loads third-party dylibs
          #     (PySide6, the Typst compiler) not signed by our Team ID.
          # The file must contain NO XML comments: codesign parses entitlements
          # with AMFI's strict parser (AMFIUnserializeXML), which rejects them
          # ("syntax error near line N").
          if [ -n "${MACOS_SIGN_IDENTITY:-}" ]; then
            codesign --force --deep --timestamp --options runtime \
              --entitlements packaging/macos/entitlements.plist \
              --sign "$MACOS_SIGN_IDENTITY" "$APP"
          else
            codesign --force --deep --sign - "$APP"
          fi
          codesign --verify --deep --strict "$APP"
          echo "Stripped .app size:"; du -sh "$APP"

      - name: Strip binaries (Linux)
        if: runner.os == 'Linux'
        run: |
          find epic-report-generator.dist -type f \( -name '*.so' -o -name '*.so.*' \) \
            -exec strip --strip-unneeded {} + 2>/dev/null || true
          echo "Stripped .dist size:"; du -sh epic-report-generator.dist

      # ── Verify the trimmed/stripped bundle still runs all features ──
      # Use Qt's headless "offscreen" platform (bundled via --include-qt-plugins=
      # sensible; verified working on the stripped standalone build) so the check
      # needs no display server.
      - name: Smoke test the bundle (Linux)
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen ./epic-report-generator.dist/epic-report-generator --selftest

      - name: Smoke test the bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          BIN='Epic Report Generator.app/Contents/MacOS/epic-report-generator'
          # Prefer offscreen; fall back to native cocoa if offscreen is unavailable.
          QT_QPA_PLATFORM=offscreen "$BIN" --selftest || "$BIN" --selftest

      - name: Smoke test the bundle (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          start /wait "" epic-report-generator.exe --selftest
          if errorlevel 1 exit /b 1

      # ── Windows installer ──────────────────────────────────────────
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y

      - name: Patch Inno Setup version
        if: runner.os == 'Windows'
        shell: bash
        run: sed -i "s/@@VERSION@@/${{ steps.meta.outputs.version }}/g" packaging/windows/setup.iss

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: iscc packaging\windows\setup.iss

      # ── macOS DMG ──────────────────────────────────────────────────
      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="Epic Report Generator.app"
          DMG="${{ matrix.installer_path }}"
          # Shared options. --hdiutil-retries hardens the hdiutil "Resource busy"
          # failure mode. Do NOT add --applescript-sleep-duration here: it would
          # harden the AppleScript -1743/-1728 "Can't get disk" flake, but it
          # exists only on create-dmg's master branch — not in the v1.2.3 release
          # that `brew install create-dmg` provides — so passing it makes every
          # invocation fail with "Unknown option". The styled -> --skip-jenkins
          # fallback below already covers AppleScript flakiness.
          common=(
            --format ULMO
            --volname "Epic Report Generator"
            --window-size 600 400 --icon-size 100 --app-drop-link 450 200
            --hdiutil-retries 10
          )
          make_dmg() {  # extra flags via "$@"
            rm -f "$DMG"
            hdiutil detach "/Volumes/Epic Report Generator" >/dev/null 2>&1 || true
            create-dmg "$@" "${common[@]}" "$DMG" "$APP"
          }
          # create-dmg's Finder-prettifying AppleScript is occasionally flaky on
          # headless runners. Retry the styled build; if it still fails, fall back
          # to a plain but fully functional DMG (--skip-jenkins skips the cosmetic
          # AppleScript; the app + /Applications drop link are still included) so a
          # release never blocks on cosmetics.
          make_dmg || make_dmg || {
            echo "::warning::Styled DMG failed twice; building plain DMG via --skip-jenkins"
            make_dmg --skip-jenkins
          }
          test -f "$DMG"

      # ── Notarize + staple the DMG (macOS) ──────────────────────────
      # A Developer ID signature alone is no longer enough: since macOS 10.15
      # Gatekeeper also requires the app to be notarized by Apple. notarytool
      # uploads the (signed) DMG, waits for the verdict, then `stapler` attaches
      # the ticket so the DMG verifies offline. Skipped when no notary key.
      - name: Notarize and staple DMG (macOS)
        if: runner.os == 'macOS' && env.MACOS_NOTARY_KEY_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          DMG="${{ matrix.installer_path }}"
          KEYFILE="$RUNNER_TEMP/notary_key.p8"
          echo "$MACOS_NOTARY_KEY_BASE64" | base64 --decode > "$KEYFILE"
          xcrun notarytool submit "$DMG" \
            --key "$KEYFILE" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          rm -f "$KEYFILE"

      # ── Linux AppImage ─────────────────────────────────────────────
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p packaging/linux/AppDir/usr/bin
          cp -r epic-report-generator.dist \
            packaging/linux/AppDir/usr/bin/epic-report-generator
          cp src/epic_report_generator/resources/logo.png \
            packaging/linux/AppDir/epic-report-generator.png
          wget -q \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run --comp xz \
            packaging/linux/AppDir epic-report-generator.AppImage

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.installer_path }}
          retention-days: 3

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
