name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "0.9.1"
  # Shared Nuitka flags applied on every platform
  NUITKA_COMMON: >-
    --standalone
    --assume-yes-for-downloads
    --enable-plugin=pyside6
    --lto=yes
    --python-flag=no_docstrings
    --python-flag=no_asserts
    --python-flag=isolated
    --jobs=4
    --noinclude-qt-translations
    --include-qt-plugins=sensible
    --include-package-data=epic_report_generator.resources
  # Modules to exclude — space-separated, expanded into --nofollow-import-to= flags at build time
  NUITKA_NOFOLLOW: >-
    tkinter unittest test distutils
    ftplib imaplib poplib smtplib telnetlib nntplib
    sunau wave aifc pydoc doctest lib2to3
    PySide6.QtWebEngineWidgets PySide6.QtWebEngineCore PySide6.QtWebEngineQuick
    PySide6.QtMultimedia PySide6.QtMultimediaWidgets
    PySide6.Qt3DCore PySide6.Qt3DRender PySide6.Qt3DInput PySide6.Qt3DLogic
    PySide6.Qt3DAnimation PySide6.Qt3DExtras
    PySide6.QtQuick PySide6.QtQuickWidgets PySide6.QtQml
    PySide6.QtDataVisualization PySide6.QtCharts PySide6.QtDesigner
    PySide6.QtHelp PySide6.QtUiTools PySide6.QtBluetooth PySide6.QtNfc
    PySide6.QtPositioning PySide6.QtSensors PySide6.QtSerialPort
    PySide6.QtRemoteObjects PySide6.QtSpatialAudio PySide6.QtTextToSpeech

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            installer_path: "epic-report-generator.AppImage"
          - os: macos-14
            installer_path: "epic-report-generator.dmg"
          - os: windows-2022
            installer_path: "packaging/windows/Output/epic-report-generator-setup.exe"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 patchelf libxkbcommon0 libxcb-cursor0 fuse libfuse2

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build "nuitka[onefile]" imageio

      - name: Run tests
        run: pytest --tb=short

      - name: Build wheel
        run: python -m build --wheel

      - name: Convert PNG to ICO (Windows)
        if: runner.os == 'Windows'
        run: |
          python -c "
          from PIL import Image
          img = Image.open('src/epic_report_generator/resources/logo.png')
          img.save('src/epic_report_generator/resources/logo.ico', sizes=[(16,16),(32,32),(48,48),(256,256)])
          "

      - name: Build Nuitka binary
        shell: bash
        run: |
          # Expand nofollow list into individual flags
          NOFOLLOW_FLAGS=()
          for mod in $NUITKA_NOFOLLOW; do
            NOFOLLOW_FLAGS+=("--nofollow-import-to=$mod")
          done

          # Platform-specific flags
          case "$RUNNER_OS" in
            Windows)
              PLATFORM_FLAGS=(
                --onefile
                "--windows-icon-from-ico=src/epic_report_generator/resources/logo.ico"
                "--windows-company-name=Epic Report Generator"
                "--windows-product-name=Epic Report Generator"
                "--windows-file-version=${APP_VERSION}.0"
                "--windows-product-version=${APP_VERSION}.0"
                "--output-filename=epic-report-generator.exe"
              )
              ;;
            macOS)
              PLATFORM_FLAGS=(
                --macos-create-app-bundle
                "--macos-app-name=Epic Report Generator"
                "--macos-app-icon=src/epic_report_generator/resources/logo.png"
                "--macos-app-version=$APP_VERSION"
                "--output-filename=epic-report-generator"
                "--output-dir=."
              )
              ;;
            Linux)
              PLATFORM_FLAGS=(
                "--output-filename=epic-report-generator"
                "--output-dir=."
              )
              ;;
          esac

          # shellcheck disable=SC2086
          python -m nuitka $NUITKA_COMMON \
            "${NOFOLLOW_FLAGS[@]}" \
            "${PLATFORM_FLAGS[@]}" \
            src/epic_report_generator/__main__.py

          # Nuitka names output dirs after the source module (__main__),
          # not --output-filename; rename to the expected names.
          case "$RUNNER_OS" in
            Linux)  mv __main__.dist epic-report-generator.dist ;;
            macOS)  mv __main__.app  epic-report-generator.app  ;;
          esac

      # ── Windows installer ──────────────────────────────────────────
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: iscc packaging\windows\setup.iss

      # ── macOS DMG ──────────────────────────────────────────────────
      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        run: |
          create-dmg \
            --volname "Epic Report Generator" \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 450 200 \
            "epic-report-generator.dmg" \
            "epic-report-generator.app"

      # ── Linux AppImage ─────────────────────────────────────────────
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p packaging/linux/AppDir/usr/bin
          cp -r epic-report-generator.dist \
            packaging/linux/AppDir/usr/bin/epic-report-generator
          cp src/epic_report_generator/resources/logo.png \
            packaging/linux/AppDir/epic-report-generator.png
          wget -q \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool packaging/linux/AppDir epic-report-generator.AppImage

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.installer_path }}
          retention-days: 3
