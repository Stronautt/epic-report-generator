name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  MAS_BUNDLE_ID: com.epicreportgenerator.app
  # arm64-only builds must target macOS 12.0+ or the App Store rejects them
  # (ITMS-90869); a universal x86_64+arm64 binary is not practical with the
  # Nuitka + PySide6 wheels. Feeds LSMinimumSystemVersion *and* the per-binary
  # Mach-O minos rewrite (see "Set Mach-O minimum macOS version"). Both channels
  # share this floor.
  MACOS_DEPLOYMENT_TARGET: "12.0"
  NUITKA_COMMON: >-
    --standalone
    --assume-yes-for-downloads
    --enable-plugin=pyside6
    --lto=yes
    --python-flag=no_docstrings
    --python-flag=no_asserts
    --python-flag=-m
    --python-flag=isolated
    --jobs=4
    --noinclude-qt-translations
    --include-qt-plugins=sensible
    --include-package-data=epic_report_generator.resources
    --include-package-data=qt_material
    --include-package=typst
    --noinclude-setuptools-mode=nofollow
    --noinclude-pytest-mode=nofollow
  NUITKA_NOFOLLOW: >-
    tkinter unittest test distutils
    ftplib imaplib poplib smtplib telnetlib nntplib
    sunau wave aifc pydoc doctest lib2to3
    PySide6.QtWebEngineWidgets PySide6.QtWebEngineCore PySide6.QtWebEngineQuick
    PySide6.QtMultimedia PySide6.QtMultimediaWidgets
    PySide6.Qt3DCore PySide6.Qt3DRender PySide6.Qt3DInput PySide6.Qt3DLogic
    PySide6.Qt3DAnimation PySide6.Qt3DExtras
    PySide6.QtQuick PySide6.QtQuickWidgets PySide6.QtQml
    PySide6.QtDataVisualization PySide6.QtCharts PySide6.QtDesigner
    PySide6.QtHelp PySide6.QtBluetooth PySide6.QtNfc
    PySide6.QtPositioning PySide6.QtSensors PySide6.QtSerialPort
    PySide6.QtRemoteObjects PySide6.QtSpatialAudio PySide6.QtTextToSpeech
    PySide6.QtSvgWidgets PySide6.QtPrintSupport PySide6.QtSql
    PySide6.QtConcurrent PySide6.QtXml PySide6.QtDBus
    PySide6.QtOpenGL PySide6.QtOpenGLWidgets

jobs:
  validate-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify tag matches pyproject.toml version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION=$(python -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          print(data['project']['version'])
          ")
          TAG="${{ github.ref_name }}"
          TAG_VERSION="${TAG#v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match pyproject.toml version '$VERSION'. Bump the version in pyproject.toml to match the tag (or retag)."
            exit 1
          fi
          echo "Tag '$TAG' matches pyproject.toml version '$VERSION'."

  build:
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            installer_path: "epic-report-generator.AppImage"
          - os: macos-26
            installer_path: "epic-report-generator.dmg"
          - os: windows-2025
            installer_path: "packaging/windows/Output/epic-report-generator-setup.exe"
    runs-on: ${{ matrix.os }}

    env:
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 patchelf libxkbcommon0 libxcb-cursor0 libfuse2t64

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build "nuitka[onefile]" imageio pillow

      - name: Run tests
        run: pytest --tb=short

      - name: Build wheel
        run: python -m build --wheel

      - name: Read version from pyproject.toml
        id: meta
        shell: bash
        run: |
          VERSION=$(python -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          print(data['project']['version'])
          ")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Convert PNG to ICO (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -c "
          from PIL import Image
          img = Image.open('src/epic_report_generator/resources/logo.png')
          img.save('src/epic_report_generator/resources/logo.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          "

      - name: Build Nuitka binary
        shell: bash
        run: |
          NOFOLLOW_FLAGS=()
          for mod in $NUITKA_NOFOLLOW; do
            NOFOLLOW_FLAGS+=("--nofollow-import-to=$mod")
          done

          case "$RUNNER_OS" in
            Windows)
              PLATFORM_FLAGS=(
                --onefile
                --include-windows-runtime-dlls=yes
                --windows-console-mode=disable
                "--windows-icon-from-ico=src/epic_report_generator/resources/logo.ico"
                "--windows-company-name=Epic Report Generator"
                "--windows-product-name=Epic Report Generator"
                "--windows-file-version=${{ steps.meta.outputs.version }}.0"
                "--windows-product-version=${{ steps.meta.outputs.version }}.0"
                "--output-filename=epic-report-generator.exe"
              )
              ;;
            macOS)
              PLATFORM_FLAGS=(
                --macos-create-app-bundle
                "--macos-app-name=Epic Report Generator"
                "--macos-signed-app-name=$MAS_BUNDLE_ID"
                "--macos-app-icon=src/epic_report_generator/resources/logo-macos.png"
                "--macos-app-version=${{ steps.meta.outputs.version }}"
                "--output-filename=epic-report-generator"
                "--output-dir=."
              )
              ;;
            Linux)
              PLATFORM_FLAGS=(
                --static-libpython=yes
                "--output-filename=epic-report-generator"
                "--output-dir=."
              )
              ;;
          esac

          # shellcheck disable=SC2086
          python -m nuitka $NUITKA_COMMON \
            "${NOFOLLOW_FLAGS[@]}" \
            "${PLATFORM_FLAGS[@]}" \
            src/epic_report_generator

          case "$RUNNER_OS" in
            Linux)  mv epic_report_generator.dist epic-report-generator.dist ;;
            macOS)  mv epic_report_generator.app  "Epic Report Generator.app"  ;;
          esac

      - name: Set bundle identity + Info.plist keys (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          PLIST="Epic Report Generator.app/Contents/Info.plist"
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          plutil -replace CFBundleIdentifier -string "$MAS_BUNDLE_ID" "$PLIST"
          plutil -replace LSApplicationCategoryType -string "public.app-category.productivity" "$PLIST"
          plutil -replace ITSAppUsesNonExemptEncryption -bool false "$PLIST"
          plutil -replace LSMinimumSystemVersion -string "$MACOS_DEPLOYMENT_TARGET" "$PLIST"
          plutil -replace CFBundleVersion -string "$BUILD_NUMBER" "$PLIST"
          plutil -replace CFBundleShortVersionString -string "${{ steps.meta.outputs.version }}" "$PLIST"
          echo "Info.plist after identity stamp:"; plutil -p "$PLIST"

      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERT_P12_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          P12="$RUNNER_TEMP/cert.p12"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed s/\"//g)
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/{print $2; exit}')" || true
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in the imported certificate."
            echo "::error::Apps distributed outside the App Store must be signed with a"
            echo "::error::Developer ID Application cert — a Mac App Store / Apple Distribution"
            echo "::error::cert will not pass Gatekeeper. Create one at developer.apple.com."
            security find-identity -v -p codesigning "$KEYCHAIN" || true
            exit 1
          fi
          echo "Signing identity: $IDENTITY"
          echo "MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$P12"

      - name: Strip binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="Epic Report Generator.app"
          find "$APP/Contents" -type f | while read -r f; do
            file "$f" | grep -q 'Mach-O' && strip -x "$f" 2>/dev/null || true
          done
          echo "Stripped .app size:"; du -sh "$APP"

      - name: Set Mach-O minimum macOS version (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="Epic Report Generator.app"
          MIN="$MACOS_DEPLOYMENT_TARGET"
          # Nuitka bakes each Mach-O's LC_BUILD_VERSION minos from the building
          # Python's own binary (Nuitka #2513) and ignores MACOSX_DEPLOYMENT_TARGET,
          # so this arm64-only build can ship minos < 12.0. App Store validation
          # rejects that (ITMS-90869) and reads the binary minos — NOT the
          # Info.plist LSMinimumSystemVersion — across EVERY nested Mach-O. Rewrite
          # them all with vtool here, before any signing: vtool edits load commands
          # and invalidates signatures, and the Dev-ID / MAS steps re-sign after.
          find "$APP/Contents" -type f | while IFS= read -r f; do
            file -b "$f" 2>/dev/null | grep -q 'Mach-O' || continue
            # Preserve each binary's real SDK; only raise the minimum-OS field.
            # `|| true`: vtool returning non-zero here must not abort the step
            # (set -euo pipefail would otherwise exit on the failed assignment).
            sdk="$(xcrun vtool -show-build "$f" 2>/dev/null | awk '$1=="sdk"{print $2; exit}' || true)"
            case "$sdk" in ""|n/a|0|0.0|0.0.0) sdk="$MIN" ;; esac
            tmp="$(mktemp)"
            if xcrun vtool -set-build-version macos "$MIN" "$sdk" -replace -output "$tmp" "$f" >/dev/null 2>&1; then
              # Overwrite contents, NOT the inode: `mv` of a 0600 mktemp file would
              # strip the +x / read bits off the executable and dylibs. `cat >`
              # keeps $f's original mode and ownership.
              cat "$tmp" > "$f"
            else
              echo "::warning::vtool could not set minos on $f"
            fi
            rm -f "$tmp"
          done
          echo "Rewrote Mach-O minos to $MIN. Main executable build version:"
          xcrun vtool -show-build "$APP/Contents/MacOS/epic-report-generator" 2>/dev/null || true

      - name: Archive unsigned .app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="Epic Report Generator.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" unsigned-app.zip
          echo "Unsigned app archive size:"; du -sh unsigned-app.zip

      - name: Upload unsigned .app (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-macos-app
          path: unsigned-app.zip
          retention-days: 3

      - name: Sign binaries (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="Epic Report Generator.app"
          # Inside-out Developer-ID signing (strip → sign deepest-first → bundle
          # last, no --deep). The script enables the hardened runtime and the
          # Dev-ID entitlements when MACOS_SIGN_IDENTITY is set, else it signs
          # inside-out ad-hoc (forks / no secrets). See packaging/macos/sign_devid.sh.
          packaging/macos/sign_devid.sh "$APP" "${MACOS_SIGN_IDENTITY:-}"
          echo "Signed .app size:"; du -sh "$APP"

      - name: Strip binaries (Linux)
        if: runner.os == 'Linux'
        run: |
          find epic-report-generator.dist -type f \( -name '*.so' -o -name '*.so.*' \) \
            -exec strip --strip-unneeded {} + 2>/dev/null || true
          echo "Stripped .dist size:"; du -sh epic-report-generator.dist

      - name: Smoke test the bundle (Linux)
        if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen ./epic-report-generator.dist/epic-report-generator --selftest

      - name: Smoke test the bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          BIN='Epic Report Generator.app/Contents/MacOS/epic-report-generator'
          QT_QPA_PLATFORM=offscreen "$BIN" --selftest || "$BIN" --selftest

      - name: Smoke test the bundle (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          start /wait "" epic-report-generator.exe --selftest
          if errorlevel 1 exit /b 1

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y

      - name: Patch Inno Setup version
        if: runner.os == 'Windows'
        shell: bash
        run: sed -i "s/@@VERSION@@/${{ steps.meta.outputs.version }}/g" packaging/windows/setup.iss

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: iscc packaging\windows\setup.iss

      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="Epic Report Generator.app"
          DMG="${{ matrix.installer_path }}"
          common=(
            --format ULMO
            --volname "Epic Report Generator"
            --window-size 600 400 --icon-size 100 --app-drop-link 450 200
            --hdiutil-retries 10
          )
          make_dmg() {
            rm -f "$DMG"
            hdiutil detach "/Volumes/Epic Report Generator" >/dev/null 2>&1 || true
            create-dmg "$@" "${common[@]}" "$DMG" "$APP"
          }
          make_dmg || make_dmg || {
            echo "::warning::Styled DMG failed twice; building plain DMG via --skip-jenkins"
            make_dmg --skip-jenkins
          }
          test -f "$DMG"

      - name: Submit DMG to notary (macOS)
        if: runner.os == 'macOS' && env.MACOS_NOTARY_KEY_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          DMG="${{ matrix.installer_path }}"
          KEYFILE="$RUNNER_TEMP/notary_key.p8"
          echo "$MACOS_NOTARY_KEY_BASE64" | base64 --decode > "$KEYFILE"
          out="$(xcrun notarytool submit "$DMG" \
            --key "$KEYFILE" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID")"
          rm -f "$KEYFILE"
          echo "$out"
          echo "$out" \
            | grep -m1 -Eo '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' \
            > notary-submission-id.txt
          test -s notary-submission-id.txt
          echo "Notary submission id: $(cat notary-submission-id.txt)"

      - name: Upload notary submission id (macOS)
        if: runner.os == 'macOS' && env.MACOS_NOTARY_KEY_BASE64 != ''
        uses: actions/upload-artifact@v7
        with:
          name: notary-submission-id
          path: notary-submission-id.txt
          retention-days: 3

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p packaging/linux/AppDir/usr/bin
          cp -r epic-report-generator.dist \
            packaging/linux/AppDir/usr/bin/epic-report-generator
          cp src/epic_report_generator/resources/logo.png \
            packaging/linux/AppDir/epic-report-generator.png
          # Desktop-menu icons: AppImageLauncher / appimaged integrate the menu
          # entry from the hicolor icon theme inside the AppImage, NOT the AppDir
          # root .DirIcon. Without sized icons here the launcher entry has no logo.
          for size in 256 512; do
            icon_dir="packaging/linux/AppDir/usr/share/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$icon_dir"
            python -c "
          from PIL import Image
          size = $size
          img = Image.open('src/epic_report_generator/resources/logo.png')
          img.resize((size, size), Image.LANCZOS).save('$icon_dir/epic-report-generator.png')
          "
          done
          wget -q \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run --comp xz \
            packaging/linux/AppDir epic-report-generator.AppImage

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.installer_path }}
          retention-days: 3

  notarize-macos:
    needs: build
    runs-on: macos-26
    env:
      MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
      MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      DMG: epic-report-generator.dmg
    steps:
      - name: Download the signed DMG from build
        uses: actions/download-artifact@v8
        with:
          name: installer-macos-26
          path: .

      - name: Download the notary submission id
        if: env.MACOS_NOTARY_KEY_BASE64 != ''
        uses: actions/download-artifact@v8
        with:
          name: notary-submission-id
          path: .

      - name: Wait for notary verdict and staple
        if: env.MACOS_NOTARY_KEY_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          id="$(cat notary-submission-id.txt)"
          KEYFILE="$RUNNER_TEMP/notary_key.p8"
          echo "$MACOS_NOTARY_KEY_BASE64" | base64 --decode > "$KEYFILE"
          set +e
          xcrun notarytool wait "$id" \
            --key "$KEYFILE" \
            --key-id "$MACOS_NOTARY_KEY_ID" \
            --issuer "$MACOS_NOTARY_ISSUER_ID" \
            --timeout 1h
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Notarization did not succeed for $id (exit $status)."
            xcrun notarytool log "$id" \
              --key "$KEYFILE" \
              --key-id "$MACOS_NOTARY_KEY_ID" \
              --issuer "$MACOS_NOTARY_ISSUER_ID" || true
            rm -f "$KEYFILE"
            exit "$status"
          fi
          rm -f "$KEYFILE"
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Re-publish the stapled DMG
        if: env.MACOS_NOTARY_KEY_BASE64 != ''
        uses: actions/upload-artifact@v7
        with:
          name: installer-macos-26
          path: ${{ env.DMG }}
          retention-days: 3
          overwrite: true

  mas-upload:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    env:
      # MAS signing certs. Both .p12 files are exported with the same password
      # as the Developer ID cert, so they reuse MACOS_CERT_PASSWORD — the MAS
      # channel adds no new password secret.
      APPLE_DIST_P12: ${{ secrets.APPLE_DIST_P12 }}
      MAC_INSTALLER_P12: ${{ secrets.MAC_INSTALLER_P12 }}
      MAS_P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      # App Store Connect API key. TestFlight upload + profile fetch need an
      # App Manager/Admin key; the notarization key is Developer-only, so the
      # MAS channel uses a dedicated ASC key for its id + .p8. The issuer ID is
      # account-wide, so it still reuses MACOS_NOTARY_ISSUER_ID.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MAS_PKG_PATH: epic-report-generator-mas.pkg
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Download the unsigned .app from build
        uses: actions/download-artifact@v8
        with:
          name: unsigned-macos-app
          path: .

      - name: Extract the unsigned .app
        shell: bash
        run: |
          set -euo pipefail
          ditto -x -k unsigned-app.zip .
          test -d "Epic Report Generator.app"

      - name: Import MAS signing certificates
        if: env.APPLE_DIST_P12 != '' && env.MAC_INSTALLER_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/mas-signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          APP_P12="$RUNNER_TEMP/apple_dist.p12"
          INST_P12="$RUNNER_TEMP/mac_installer.p12"
          echo "$APPLE_DIST_P12" | base64 --decode > "$APP_P12"
          echo "$MAC_INSTALLER_P12" | base64 --decode > "$INST_P12"
          security import "$APP_P12" -k "$KEYCHAIN" -P "$MAS_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security import "$INST_P12" -k "$KEYCHAIN" -P "$MAS_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed s/\"//g)
          rm -f "$APP_P12" "$INST_P12"

          APP_ID="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Apple Distribution|3rd Party Mac Developer Application/{print $2; exit}')" || true
          INST_ID="$(security find-identity -v "$KEYCHAIN" \
            | awk -F'"' '/Mac Installer Distribution|3rd Party Mac Developer Installer/{print $2; exit}')" || true
          if [ -z "$APP_ID" ]; then
            echo "::error::No 'Apple Distribution' identity in APPLE_DIST_P12."
            security find-identity -v "$KEYCHAIN" || true
            exit 1
          fi
          if [ -z "$INST_ID" ]; then
            echo "::error::No 'Mac Installer Distribution' identity in MAC_INSTALLER_P12."
            security find-identity -v "$KEYCHAIN" || true
            exit 1
          fi
          echo "App signing identity:       $APP_ID"
          echo "Installer signing identity: $INST_ID"
          echo "APPLE_DIST_IDENTITY=$APP_ID" >> "$GITHUB_ENV"
          echo "MAC_INSTALLER_IDENTITY=$INST_ID" >> "$GITHUB_ENV"

      - name: Materialize ASC API key for altool
        if: env.ASC_KEY_ID != '' && env.ASC_KEY_P8 != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private_keys
          echo "$ASC_KEY_P8" | base64 --decode > "private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Fetch MAS provisioning profile
        if: env.ASC_KEY_ID != ''
        shell: bash
        run: bundle exec fastlane mac profile

      - name: Sign the .app inside-out for the Mac App Store
        if: env.APPLE_DIST_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="$(ls build/*.provisionprofile 2>/dev/null | head -1 || true)"
          MAS_PROFILE="$PROFILE" \
            packaging/macos/sign_mas.sh "Epic Report Generator.app" "$APPLE_DIST_IDENTITY"

      - name: Build + validate the signed .pkg
        if: env.MAC_INSTALLER_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          packaging/macos/build_pkg.sh "Epic Report Generator.app" "$MAC_INSTALLER_IDENTITY" "$MAS_PKG_PATH"

      - name: Upload to TestFlight
        if: env.ASC_KEY_ID != ''
        shell: bash
        run: bundle exec fastlane mac beta

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, notarize-macos, mas-upload]
    runs-on: ubuntu-24.04
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          merge-multiple: true
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*
