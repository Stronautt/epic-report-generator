[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epic-report-generator"
version = "1.0.5"
description = "PySide6 desktop app that generates PDF Epic progress reports from Jira Cloud"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Epic Report Generator Contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "PySide6>=6.11,<7",
    "jira>=3.10,<4",
    "requests>=2.32,<3",
    "typst>=0.13,<0.16",
    "keyring>=25.7,<26",
    "platformdirs>=4.10,<5",
    "python-dateutil>=2.9,<3",
    "qt-material>=2.17",
    "markdown>=3.5,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.5",
    "pytest-cov>=5.0",
    "build>=1.2",
    "pypdf>=5.0",
    "PyYAML>=6.0",
]

[project.scripts]
epic-report-generator = "epic_report_generator.__main__:main"

[project.gui-scripts]
epic-report-generator-gui = "epic_report_generator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
epic_report_generator = ["resources/**/*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
